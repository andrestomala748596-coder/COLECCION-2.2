name: AJPLAY Series 24/7 Extractor

on:
  push:
    branches: ["**"]
    paths:
      - "urls.txt"
      - "extractor.py"
      - "requirements.txt"
      - ".github/workflows/extractor.yml"
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ajplay-series-247
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Validar urls.txt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("urls.txt")
          if not p.exists() or not p.read_text(encoding="utf-8").strip():
              raise SystemExit("ERROR: urls.txt no existe o está vacío")
          value = json.loads(p.read_text(encoding="utf-8"))
          if not isinstance(value, list):
              raise SystemExit("ERROR: urls.txt debe ser un array JSON")
          print(f"Entradas: {len(value)}")
          PY
      - name: Extraer enlaces 24/7
        env:
          PYTHONUNBUFFERED: "1"
        run: python extractor.py
      - name: Guardar catálogo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add base series category_list.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar catálogo de series 24/7 [skip ci]"
            git push
          fi
