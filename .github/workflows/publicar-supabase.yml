name: AJPLAY Sincronizar series con Supabase
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publicar-supabase.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ajplay-publicacion-series
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publicar catálogo de series existente, sin extraer
        env:
          SUPABASE_URL: https://nyjgdfqxodcmcsdaprzi.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python -m pip install requests
          python sync_supabase.py
